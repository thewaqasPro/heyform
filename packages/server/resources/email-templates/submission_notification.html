---
title: New submission received for {formName}
---

<div style="background-color: #f8fafc; padding: 32px 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; color: #0f172a;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
    <!-- Header -->
    <tr>
      <td style="padding: 32px 32px 24px 32px; border-bottom: 1px solid #f1f5f9; text-align: center;">
        {logoBlock}
        <div style="margin-bottom: 8px;">
          <span style="display: inline-block; padding: 4px 12px; background-color: #eff6ff; color: #2563eb; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;">New Submission</span>
        </div>
        <h1 style="margin: 8px 0 4px 0; font-size: 22px; font-weight: 700; color: #0f172a; line-height: 1.3;">{formName}</h1>
        <p style="margin: 0; font-size: 13px; color: #64748b;">{workspaceName} &bull; {submissionDate}</p>
      </td>
    </tr>

    <!-- Submission Content -->
    <tr>
      <td style="padding: 24px 32px;">
        <div style="margin-bottom: 24px;">
          {submission}
        </div>

        <!-- CTA Button -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td align="center" style="padding-top: 8px;">
              <a href="{link}" target="_blank" style="display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 14px 24px; background-color: #0f172a; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.2px;">
                View All Submissions &rarr;
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding: 20px 32px; background-color: #f8fafc; border-top: 1px solid #f1f5f9; text-align: center;">
        <p style="margin: 0; font-size: 12px; color: #94a3b8;">
          You received this email because submission notifications are enabled for this form.
        </p>
      </td>
    </tr>
  </table>
</div>
